name: Nexvion CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: nexvion-web:ci
          load: true

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nexvion-web:ci
          scan-type: image
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Test website pages
        run: |
          docker run -d --name nexvion-test -p 8080:80 nexvion-web:ci
          trap 'docker rm -f nexvion-test >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 10); do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              break
            fi
            sleep 2
          done

          curl --fail http://localhost:8080/
          curl --fail http://localhost:8080/products.html
          curl --fail http://localhost:8080/payment.html

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/cloudwithc/nexvion:latest

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Deploy Nexvion
        run: |
          set -eu

          docker pull ghcr.io/cloudwithc/nexvion:latest

          docker rm -f nexvion-web 2>/dev/null || true

          docker run -d \
            --name nexvion-web \
            --restart unless-stopped \
            -p 8088:80 \
            ghcr.io/cloudwithc/nexvion:latest

          for i in $(seq 1 10); do
            if curl --fail --silent http://localhost:8088/ > /dev/null; then
              echo "Nexvion deployment successful"
              exit 0
            fi
            sleep 2
          done

          echo "Nexvion health check failed"
          docker logs nexvion-web
          exit 1
