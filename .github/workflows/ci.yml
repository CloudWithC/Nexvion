name: Nexvion CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: nexvion-web:ci
          load: true

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nexvion-web:ci
          scan-type: image
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Test website pages
        run: |
          docker run -d --name nexvion-test -p 8080:80 nexvion-web:ci
          trap 'docker rm -f nexvion-test >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 10); do
            if curl --fail --silent http://localhost:8080/ >/dev/null; then
              break
            fi
            sleep 2
          done

          curl --fail http://localhost:8080/
          curl --fail http://localhost:8080/products.html
          curl --fail http://localhost:8080/payment.html

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/cloudwithc/nexvion:latest

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - name: Deploy Nexvion safely with rollback
        run: |
          set -Eeuo pipefail

          IMAGE="ghcr.io/cloudwithc/nexvion:latest"
          OLD="nexvion-web"
          CANDIDATE="nexvion-candidate"
          PREVIOUS="nexvion-previous"

          docker pull "$IMAGE"

          if docker container inspect "$PREVIOUS" >/dev/null 2>&1; then
            echo "Recovery container already exists. Stop and inspect before deploying."
            exit 1
          fi

          docker rm -f "$CANDIDATE" >/dev/null 2>&1 || true

          echo "Starting candidate on port 8089..."
          docker run -d --name "$CANDIDATE" -p 8089:80 "$IMAGE"

          echo "Testing candidate pages..."
          CANDIDATE_OK=false

          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8089/ >/dev/null &&
               curl -fsS http://localhost:8089/products.html >/dev/null &&
               curl -fsS http://localhost:8089/payment.html >/dev/null; then
              CANDIDATE_OK=true
              break
            fi
            sleep 2
          done

          if [ "$CANDIDATE_OK" != "true" ]; then
            docker logs "$CANDIDATE" || true
            docker rm -f "$CANDIDATE" || true
            echo "Candidate checks failed. Production remains unchanged."
            exit 1
          fi

          echo "Candidate passed. Preparing production switch..."

          if docker container inspect "$OLD" >/dev/null 2>&1; then
            docker stop "$OLD"
            docker rename "$OLD" "$PREVIOUS"
          fi

          rollback() {
            echo "Deployment failed. Restoring previous version..."
            docker rm -f "$OLD" >/dev/null 2>&1 || true

            if docker container inspect "$PREVIOUS" >/dev/null 2>&1; then
              docker rename "$PREVIOUS" "$OLD"
              docker start "$OLD"
            fi

            docker rm -f "$CANDIDATE" >/dev/null 2>&1 || true
          }

          if ! docker run -d \
            --name "$OLD" \
            --restart unless-stopped \
            -p 8088:80 \
            "$IMAGE"; then
            rollback
            exit 1
          fi

          echo "Checking production pages..."

          DEPLOY_OK=false

          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8088/ >/dev/null &&
               curl -fsS http://localhost:8088/products.html >/dev/null &&
               curl -fsS http://localhost:8088/payment.html >/dev/null; then
              DEPLOY_OK=true
              break
            fi
            sleep 2
          done

          if [ "$DEPLOY_OK" != "true" ]; then
            docker logs "$OLD" || true
            rollback
            exit 1
          fi

          echo "Production health checks passed."

          docker rm -f "$PREVIOUS" >/dev/null 2>&1 || true
          docker rm -f "$CANDIDATE" >/dev/null 2>&1 || true

          echo "Nexvion deployment successful!"
